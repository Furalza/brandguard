[project]
name = "brandguard"
version = "0.1.0"
description = "Brand impersonation detection across app marketplaces"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
llm = ["anthropic>=0.40", "openai>=1.40"]
icons = ["imagehash>=4.3", "pillow>=10.0"]
live = ["google-play-scraper>=1.2"]
serper = ["requests>=2.28"]
whois = ["python-whois>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
