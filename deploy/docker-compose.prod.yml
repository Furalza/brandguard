# Production-style deployment: BrandGuard behind Caddy with automatic HTTPS.
#
#   BRANDGUARD_DOMAIN=203-0-113-10.sslip.io docker compose -f deploy/docker-compose.prod.yml up --build -d
#
# Run from the repository root. Caddy obtains a Let's Encrypt certificate for
# BRANDGUARD_DOMAIN (a real domain, or <server-ip with dashes>.sslip.io which
# needs no DNS setup) and proxies to the app, which is not exposed directly.
services:
  brandguard:
    build:
      context: ..
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    depends_on:
      - brandguard
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BRANDGUARD_DOMAIN=${BRANDGUARD_DOMAIN:?set BRANDGUARD_DOMAIN, e.g. 1-2-3-4.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
